name: Build and Deploy Dashboard to k3s

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/osamabarakaat/eshraqat-al-mustaqbal-dashboard
  K8S_NAMESPACE: eshraqat
  DEPLOYMENT_NAME: eshraqat-dashboard
  CONTAINER_NAME: dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM64 k3s node)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL || 'https://api.example.com/api/v1' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Dashboard manifests to k3s cluster (eshraqat)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST || '80.225.65.121' }}
          SSH_USER: ${{ secrets.SSH_USER || 'ubuntu' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${SSH_PRIVATE_KEY}" ]; then
            echo "ERROR: SSH_PRIVATE_KEY secret is empty or not set in this repository's GitHub Actions secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          if printf '%s' "${SSH_PRIVATE_KEY}" | grep -q "BEGIN"; then
            printf '%s\n' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "${SSH_PRIVATE_KEY}" | tr -d ' \n\r' | base64 -d > ~/.ssh/id_ed25519
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts

          ssh "${SSH_USER}@${SSH_HOST}" "mkdir -p ~/k8s-dashboard"
          scp -r k8s/* "${SSH_USER}@${SSH_HOST}:~/k8s-dashboard/"

          ssh "${SSH_USER}@${SSH_HOST}" << EOF
            set -e
            cd ~/k8s-dashboard

            sudo kubectl apply -f 00-namespace.yaml

            sudo kubectl -n ${K8S_NAMESPACE} create secret docker-registry ghcr-secret \
              --docker-server=${REGISTRY} \
              --docker-username=${GITHUB_ACTOR} \
              --docker-password=${GHCR_PULL_TOKEN} \
              --dry-run=client -o yaml | sudo kubectl apply -f -

            sudo kubectl apply -k .
            sudo kubectl -n ${K8S_NAMESPACE} set image deployment/${DEPLOYMENT_NAME} \
              ${CONTAINER_NAME}=${IMAGE_NAME}:${GITHUB_SHA}
            sudo kubectl -n ${K8S_NAMESPACE} rollout status deployment/${DEPLOYMENT_NAME} --timeout=180s
          EOF
